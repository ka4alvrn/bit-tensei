<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bit Tensei</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Окно создания персонажа -->
  <div id="creation-overlay">
    <div class="modal-title">🔮 Колесо Сансары</div>
    <div class="modal-sub">Выберите судьбу для новой жизни в Шестиликом Мире</div>

    <div class="input-group">
      <label>Имя персонажа</label>
      <input type="text" id="input-name" value="Рудеус" placeholder="Введите имя...">
    </div>

    <div class="input-group">
      <label>Регион Рождения</label>
      <select id="select-region" onchange="updateOriginSelect()"></select>
    </div>

    <div class="input-group">
      <label>Происхождение и Родословная</label>
      <select id="select-origin"></select>
    </div>

    <button class="btn-main" onclick="confirmCreation()">✨ Воплотиться в новом теле</button>
    <button style="background: #252a38; border: none; padding: 12px; border-radius: 10px; color:#fff;" onclick="randomCreation()">
      🎲 Полный рандом богов
    </button>
  </div>

  <!-- Главный экран -->
  <div class="card">
    <div class="header">
      <div>
        <div class="name" id="char-name">Имя</div>
        <div class="region-badge" id="char-region">Регион</div>
        <div id="char-trait" class="tag">Талант</div>
      </div>
      <div style="text-align: right;">
        <div style="font-weight: 700; color: var(--accent);" id="age">0 лет</div>
        <div class="gen-badge" id="char-gen">Поколение 1</div>
      </div>
    </div>

    <div style="margin-top: 10px; font-size: 12px; display:flex; justify-content:space-between;">
      <span>Мана</span><span id="mana-text">30/30</span>
    </div>
    <div class="bar-bg"><div class="bar-mana" id="mana-bar" style="width: 100%;"></div></div>

    <div class="stats">
      <div class="stat">🧙 Ранг магии: <b id="magic">Новичок</b></div>
      <div class="stat">⚔️ Стиль меча: <b id="sword">Нет</b></div>
      <div class="stat">📚 Знания: <b id="intellect">10</b></div>
      <div class="stat">🪙 Деньги: <b id="coins">0</b></div>
    </div>
  </div>

  <div class="log-box" id="logs"></div>

  <div class="grid-btns">
    <button onclick="trainMana()">✨ Мана</button>
    <button onclick="trainSword()">🗡️ Меч</button>
    <button onclick="readBook()">📚 Книги</button>
    <button onclick="explore()">🌲 Разведка</button>
  </div>

  <button class="btn-main" onclick="ageUp()">⏳ Прожить 1 год</button>
  <button class="btn-secondary" onclick="showCreation()">🔄 Начать новую жизнь (Реинкарнация)</button>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
